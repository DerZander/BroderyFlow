[package]
name = "flowweave"
version = "0.1.0"
description = "Visual JavaScript workflow canvas"
authors = ["BroderyFlow"]
edition = "2021"

[lib]
name = "flowweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
